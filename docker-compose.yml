name: openings

# Two containers, one image, one data volume.
#
#   scheduler  -> `openings scheduler`  collects on the configured interval
#   web        -> `openings web`        dashboard, REST API, MCP endpoint
#
# settings.yaml is bind-mounted read-only from the host so it can be edited
# with any editor; edit it and `docker compose restart`. Everything else
# (database, attachments, vector index, logs) lives in the named volume.
#
# Both containers run as an unprivileged user (UID 1000). The web port binds to
# localhost by default; set OPENINGS_WEB_BIND=0.0.0.0 in .env only on a trusted
# network.

networks:
  default:
    name: openings
    enable_ipv6: false

volumes:
  openings-data:
    name: openings-data

services:
  scheduler:
    image: vincenzoimp/openings:latest
    container_name: openings-scheduler
    restart: unless-stopped
    command: ["openings", "scheduler"]
    dns:
      - 1.1.1.1
      - 8.8.8.8
    env_file:
      - path: .env
        required: false
    volumes:
      - openings-data:/data
      - ./settings.yaml:/data/config/settings.yaml:ro

  web:
    image: vincenzoimp/openings:latest
    container_name: openings-web
    restart: unless-stopped
    command: ["openings", "web"]
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "${OPENINGS_WEB_BIND:-127.0.0.1}:${OPENINGS_WEB_PORT:-8501}:8501"
    env_file:
      - path: .env
        required: false
    volumes:
      - openings-data:/data
      - ./settings.yaml:/data/config/settings.yaml:ro
