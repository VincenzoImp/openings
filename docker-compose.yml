name: openings

services:
  openings:
    image: ${OPENINGS_IMAGE:-docker.io/vincenzoimp/openings:0.24.2}
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "${OPENINGS_BIND:-127.0.0.1}:${OPENINGS_PORT:-8080}:8080"
    environment:
      OPENINGS_PUBLIC_URL: ${OPENINGS_PUBLIC_URL:-http://127.0.0.1:8080}
      OPENINGS_PASSWORD: ${OPENINGS_PASSWORD:-}
      # Optional upper bound; the restore limit follows free space on the volume.
      OPENINGS_MAX_RESTORE_MB: ${OPENINGS_MAX_RESTORE_MB:-}
      OPENINGS_RETENTION_DAYS: ${OPENINGS_RETENTION_DAYS:-90}
      OPENINGS_COMPACT_MIN_MB: ${OPENINGS_COMPACT_MIN_MB:-32}
      OPENINGS_TRUSTED_PROXIES: ${OPENINGS_TRUSTED_PROXIES:-}
      OPENINGS_BACKUP_KEEP: ${OPENINGS_BACKUP_KEEP:-3}
      OPENINGS_BACKUP_DIR: ${OPENINGS_BACKUP_DIR:-}
    volumes:
      - workspace:/data
    # Every write goes to /data; temporary files of the libraries go to /tmp.
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  workspace:
