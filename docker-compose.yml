name: openings

services:
  openings:
    image: ${OPENINGS_IMAGE:-docker.io/vincenzoimp/openings:0.12.0}
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "${OPENINGS_BIND:-127.0.0.1}:${OPENINGS_PORT:-8080}:8080"
    environment:
      OPENINGS_PUBLIC_URL: ${OPENINGS_PUBLIC_URL:-http://127.0.0.1:8080}
      OPENINGS_PASSWORD: ${OPENINGS_PASSWORD:-}
      OPENINGS_MAX_RESTORE_MB: ${OPENINGS_MAX_RESTORE_MB:-512}
    volumes:
      - workspace:/data
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  workspace:
