name: openings

services:
  openings:
    image: ${OPENINGS_IMAGE:-docker.io/vincenzoimp/openings:0.19.0}
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "${OPENINGS_BIND:-127.0.0.1}:${OPENINGS_PORT:-8080}:8080"
    environment:
      OPENINGS_PUBLIC_URL: ${OPENINGS_PUBLIC_URL:-http://127.0.0.1:8080}
      OPENINGS_PASSWORD: ${OPENINGS_PASSWORD:-}
      # Optional upper bound; the restore limit follows free space on the volume.
      OPENINGS_MAX_RESTORE_MB: ${OPENINGS_MAX_RESTORE_MB:-}
      OPENINGS_RETENTION_DAYS: ${OPENINGS_RETENTION_DAYS:-90}
      OPENINGS_COMPACT_MIN_MB: ${OPENINGS_COMPACT_MIN_MB:-32}
      OPENINGS_TRUSTED_PROXIES: ${OPENINGS_TRUSTED_PROXIES:-}
    volumes:
      - workspace:/data
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  workspace:
