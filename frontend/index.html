<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Self-hosted job-search app. Set up your career, rules, templates and sources once; your own AI agent (Claude Code, Codex, any MCP client) works it by your rules. You apply."
    />
    <title>Openings</title>
    <!-- The mark: an SVG that follows the system theme, a PNG for browsers
         without SVG icons, and the home-screen icon. -->
    <link rel="icon" href="/src/ui/favicon.svg" type="image/svg+xml" />
    <link
      rel="icon"
      href="/src/ui/favicon-32.png"
      type="image/png"
      sizes="32x32"
    />
    <link rel="apple-touch-icon" href="/src/ui/apple-touch-icon.png" />
    <!-- The cascade layers in their order, before any stylesheet: the first
         mention of a layer fixes its place, whatever order the build gives
         the rules. -->
    <style>
      @layer reset, tokens, ui, screens;
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
