<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- The Openings mark, "Doorway": the tile is a wall, the mark the light
       through an opening at its foot. The ink tile of each theme. -->
  <style>
    .tile { fill: #18181b; }
    .opening { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #ececef; }
      .opening { fill: #111113; }
    }
  </style>
  <rect class="tile" width="24" height="24" rx="6" />
  <path class="opening" d="M8 24V11.5a4 4 0 0 1 8 0V24Z" />
</svg>
