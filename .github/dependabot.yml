version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Deferred to a dedicated upgrade: mcp 2 renames FastMCP and changes the
      # server and client APIs.
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The runtime Python matches CI, requires-python and the locked wheels
      # (3.14). Moving to a new Python minor is a deliberate change made in all
      # of them together: every compiled dependency, such as pydantic-core, must
      # publish wheels for it first.
      - dependency-name: python
        update-types: ["version-update:semver-minor"]
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
