version: 2
updates:
  # Also bumps the uv that CI uses (the `uv` group in pyproject.toml).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # The browser tests run in the Playwright image whose tag equals this
      # version (ci.yml, weekly.yml, screenshots.yml), which Dependabot does not
      # update. Bump both by hand together; ci.yml checks that they match.
      - dependency-name: "@playwright/test"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend/tools/openapi
    schedule:
      interval: weekly
    ignore:
      # openapi-typescript needs TypeScript 5; the dashboard itself builds with 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The runtime Python matches CI, requires-python and the locked wheels
      # (3.14). Moving to a new Python minor is a deliberate change made in all
      # of them together: every compiled dependency, such as pydantic-core, must
      # publish wheels for it first.
      - dependency-name: python
        update-types: ["version-update:semver-minor"]
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
