name: Retire a Docker Hub repository

# One-off: delete the previous product's image repository on Docker Hub with
# the same credentials the release workflow uses. Remove this file afterwards.

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Docker Hub repository to delete (namespace/name)
        required: true
        default: vincenzoimp/job-search-tool

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the repository through the Docker Hub API
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REPOSITORY: ${{ inputs.repository }}
        run: |
          set -eu
          token=$(python3 - <<'PY'
          import json, os, urllib.request
          body = json.dumps({"username": os.environ["DOCKERHUB_USERNAME"], "password": os.environ["DOCKERHUB_TOKEN"]}).encode()
          req = urllib.request.Request("https://hub.docker.com/v2/users/login/", data=body, headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(req, timeout=30) as response:
              print(json.load(response)["token"])
          PY
          )
          code=$(curl -s -o /tmp/response -w '%{http_code}' -X DELETE \
            "https://hub.docker.com/v2/repositories/$REPOSITORY/" \
            -H "Authorization: JWT $token")
          echo "HTTP $code"
          cat /tmp/response || true
          case "$code" in 200|202|204) exit 0 ;; *) exit 1 ;; esac
