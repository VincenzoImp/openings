name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

env:
  UV_VERSION: "0.11.6"
  UV_TORCH_BACKEND: cpu

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
          cache-suffix: quality

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files

      - name: Type check with mypy
        run: uv run mypy src/openings --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
          cache-suffix: py${{ matrix.python-version }}-ci

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run tests with coverage
        if: matrix.python-version == '3.12'
        run: uv run pytest --cov=openings --cov-report=xml --cov-fail-under=80

      - name: Run tests
        if: matrix.python-version != '3.12'
        run: uv run pytest

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Quality gate (lint, format, typecheck, test, build)
        run: npm run quality

  e2e:
    # Playwright drives the built dashboard against a real `openings web`
    # (temporary data directory, no network sources) on desktop, phone and
    # tablet viewports, in light and dark, with axe on every view.
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
          cache-suffix: e2e

      - name: Sync dependencies
        run: uv sync --locked

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build the dashboard
        working-directory: frontend
        run: npm run build

      - name: Run the end-to-end suite
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
          cache-suffix: security

      - name: Export runtime requirements
        run: |
          mkdir -p .tmp
          uv export --frozen --no-dev --no-emit-project --output-file .tmp/requirements-audit.txt

      - name: Security audit
        run: |
          # --no-deps: the export is fully pinned and uv's dependency overrides
          # (numpy, markdownify) are not something pip can re-resolve.
          uvx --python 3.12 --from 'pip-audit==2.9.0' pip-audit --no-deps --disable-pip -r .tmp/requirements-audit.txt

  docker:
    # Runs on PRs and on push to main so a direct push (skipping a PR) still
    # validates the image build, healthcheck, compose topology, and web smoke.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: openings:test
          cache-from: type=gha,scope=ci-docker
          cache-to: type=gha,scope=ci-docker,mode=max
          provenance: false
          sbom: false

      - name: Test health check
        run: |
          docker run --rm \
            -v "$PWD/config/settings.example.yaml:/data/config/settings.yaml:ro" \
            openings:test openings healthcheck

      - name: Validate Compose topology
        run: |
          cp config/settings.example.yaml settings.yaml
          docker compose config
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config

      - name: Smoke web container
        run: |
          docker rm -f openings-web-smoke || true
          docker run --rm -d \
            --name openings-web-smoke \
            -p 18501:8501 \
            -v "$PWD/config/settings.example.yaml:/data/config/settings.yaml:ro" \
            openings:test openings web
          trap 'docker rm -f openings-web-smoke' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18501/health; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18501/api/jobs
          curl -fsS http://127.0.0.1:18501/ >/tmp/openings-index.html
          grep -q '<div id="root"></div>' /tmp/openings-index.html

      - name: End-to-end smoke (REST and MCP against the built image)
        run: SKIP_BUILD=1 IMAGE=openings:test PORT=18652 sh docker/smoke.sh
