name: CI

# Required checks on `main` (docs/developer/maintaining.md): backend, frontend,
# e2e and container (amd64). Renaming a job means updating the branch ruleset in
# the same change. `e2e` is the gate of the browser shards `e2e (1)` and
# `e2e (2)`, so the shard count changes without a ruleset change. A release
# (images.yml) requires this workflow to have passed on the tagged commit.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check backend scripts
      - run: uv run ruff format --check backend scripts
      - run: python3 scripts/bump_version.py --check
      # The default selection skips `performance` (pyproject.toml); weekly.yml runs it.
      - run: uv run pytest -q -n auto backend
      # A practical complete workflow: an agent over real MCP and HTTP (synthetic PDF;
      # pass --tectonic to compile the CV locally).
      - name: Agent round trip
        run: uv run python backend/tests/agent_roundtrip.py
      - name: Smoke installed wheel and packaged resources
        run: |
          uv build --wheel --out-dir /tmp/openings-wheel
          uv run python scripts/check_package.py /tmp/openings-wheel/openings-*.whl

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/tools/openapi/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked
      - run: npm --prefix frontend ci
      # The generated API types match the backend's OpenAPI document.
      - run: npm --prefix frontend run api:check
      # `build` typechecks (tsc --noEmit) before bundling.
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend run budget
      - run: npm --prefix frontend run format:check
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend test

  e2e-shard:
    name: e2e (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # The official Playwright image ships the browsers and their system
    # dependencies, so the job downloads none. Its tag must equal the
    # @playwright/test version in frontend/package-lock.json (checked below);
    # bump both together and refresh the digest.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The image matches the locked Playwright version
        env:
          IMAGE_PLAYWRIGHT: '1.65.0'
        run: |
          locked="$(node -p "require('./frontend/package-lock.json').packages['node_modules/@playwright/test'].version")"
          if [ "$locked" != "$IMAGE_PLAYWRIGHT" ]; then
            echo "::error::@playwright/test is $locked but the e2e image is v$IMAGE_PLAYWRIGHT; update the image in ci.yml, weekly.yml and screenshots.yml."
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      # Each worker serves its own copy of the seeded workspace (tests/fixtures.ts);
      # playwright.config.ts sets 4 workers, one retry and fails on a flaky test.
      # `test:e2e` runs the chromium and chromium-mobile projects.
      - run: npm --prefix frontend run test:e2e -- --shard=${{ matrix.shard }}/2
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every browser shard passed
        env:
          RESULT: ${{ needs.e2e-shard.result }}
        run: test "$RESULT" = success

  container:
    name: container (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Pull requests smoke amd64 only; pushes to main and manual runs smoke
        # both architectures.
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"arch":"amd64","runner":"ubuntu-24.04"}]' || '[{"arch":"amd64","runner":"ubuntu-24.04"},{"arch":"arm64","runner":"ubuntu-24.04-arm"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Validate Compose
        run: docker compose config --quiet
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: openings:ci
          cache-from: type=gha,scope=core-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=core-${{ matrix.arch }}
      - name: Smoke the nonroot empty workspace
        run: scripts/smoke_image.sh openings:ci ${{ matrix.arch }}
