name: CI

# Required checks on `main` (see CONTRIBUTING.md, "Repository settings"):
# backend, frontend, e2e and container (amd64). Renaming a job means updating
# the branch ruleset in the same change.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.8'
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check backend scripts
      - run: uv run ruff format --check backend scripts
      - run: python3 scripts/bump_version.py --check
      # The default selection skips `performance` (pyproject.toml); nightly.yml runs it weekly.
      - run: uv run pytest -q -n auto backend
      - name: Smoke installed wheel and packaged resources
        run: |
          uv build --wheel --out-dir /tmp/openings-wheel
          uv run python scripts/check_package.py /tmp/openings-wheel/openings-*.whl

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      # `build` typechecks (tsc --noEmit) before bundling.
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend run budget
      - run: npm --prefix frontend run format:check
      - run: npm --prefix frontend test

  e2e:
    runs-on: ubuntu-24.04
    # The official Playwright image ships the browsers and their system
    # dependencies, so the job downloads none. Its tag must equal the
    # @playwright/test version in frontend/package-lock.json (checked below);
    # bump both together and refresh the digest.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The image matches the locked Playwright version
        env:
          IMAGE_PLAYWRIGHT: '1.65.0'
        run: |
          locked="$(node -p "require('./frontend/package-lock.json').packages['node_modules/@playwright/test'].version")"
          if [ "$locked" != "$IMAGE_PLAYWRIGHT" ]; then
            echo "::error::@playwright/test is $locked but the e2e image is v$IMAGE_PLAYWRIGHT; update the image in ci.yml and nightly.yml."
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.8'
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      # The runtime parity gate is gone: the quarantined documents spec was the
      # only browser evidence for three operations, and #206 replaces the parity
      # tooling with one test. `pytest` still checks the committed matrix.
      - run: npm --prefix frontend run test:e2e -- --project=chromium --project=chromium-mobile
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  container:
    name: container (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Pull requests smoke amd64 only; pushes to main, manual runs and
        # releases (workflow_call from images.yml) smoke both architectures.
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"arch":"amd64","runner":"ubuntu-24.04"}]' || '[{"arch":"amd64","runner":"ubuntu-24.04"},{"arch":"arm64","runner":"ubuntu-24.04-arm"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Validate Compose
        run: docker compose config --quiet
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: openings:ci
          cache-from: type=gha,scope=core-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=core-${{ matrix.arch }}
      - name: Smoke the nonroot empty workspace
        shell: bash
        run: |
          set -euo pipefail
          docker volume create openings-ci
          trap 'docker logs openings-ci; docker rm -f openings-ci; docker volume rm openings-ci' EXIT
          docker run -d --name openings-ci --init --cpus=0.5 --memory=512m \
            --platform linux/${{ matrix.arch }} \
            --publish 127.0.0.1:18080:8080 --mount source=openings-ci,target=/data openings:ci
          for attempt in {1..60}; do
            if curl --silent --fail http://127.0.0.1:18080/health > /tmp/openings-health.json; then break; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:18080/health
          test "$(docker exec openings-ci id -u)" = 10001
          docker exec openings-ci test -f /data/openings.sqlite
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/api/v1/career/profile)" = 401
          curl --silent --fail http://127.0.0.1:18080/api/v1/auth/setup \
            --header 'Content-Type: application/json' --cookie-jar /tmp/openings-cookie \
            --data '{"password":"synthetic-ci-password"}' --output /tmp/openings-session.json
          curl --silent --fail --cookie /tmp/openings-cookie \
            http://127.0.0.1:18080/api/v1/career/profile --output /tmp/openings-profile.json
          python -c "import json; p=json.load(open('/tmp/openings-profile.json')); assert p['name']=='' and p['version']>=1"
          curl --silent --fail --cookie /tmp/openings-cookie \
            http://127.0.0.1:18080/api/v1/capabilities --output /tmp/openings-capabilities.json
          python -c "import json,tomllib; p=json.load(open('/tmp/openings-capabilities.json')); assert p['version']==tomllib.load(open('pyproject.toml','rb'))['project']['version'] and len(p['operations'])>=83"
          curl --silent --fail --cookie /tmp/openings-cookie \
            http://127.0.0.1:18080/api/v1/skills --output /tmp/openings-skills.json
          python -c "import json,pathlib; served={s['name'] for s in json.load(open('/tmp/openings-skills.json'))['items']}; shipped={p.parent.name for p in pathlib.Path('skills').glob('*/SKILL.md')}; assert served==shipped and served, (served, shipped)"
          docker exec openings-ci python -c "from pathlib import Path; import openings; assert Path(openings.__file__).with_name('operation-inventory.json').is_file()"
          docker exec openings-ci python -c "from pathlib import Path; import hashlib,json,openings; p=Path(openings.__file__).parent; print(json.dumps({str(f.relative_to(p)):hashlib.sha256(f.read_bytes()).hexdigest() for f in p.rglob('*') if f.is_file() and '__pycache__' not in f.parts}))" > /tmp/openings-package-hashes.json
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess
          installed = json.load(open('/tmp/openings-package-hashes.json'))
          for name in subprocess.check_output(['git', 'ls-files', 'backend/openings'], text=True).splitlines():
              path = Path(name)
              assert installed[str(path.relative_to('backend/openings'))] == hashlib.sha256(path.read_bytes()).hexdigest(), name
          assert installed['operation-inventory.json'] == hashlib.sha256(Path('backend/openings/operation-inventory.json').read_bytes()).hexdigest()
          PY
          curl --silent --fail http://127.0.0.1:18080/ --output /tmp/openings-index.html
          python -c "assert '<div id=\"root\"></div>' in open('/tmp/openings-index.html').read()"
