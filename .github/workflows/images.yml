name: Release images

# Flow: version (and the release notes from the CHANGELOG section) -> checks (CI
# passed on this commit) and audit -> image (native amd64/arm64: build with SBOM
# and max provenance, push by digest, smoke-test that digest) -> publish
# (multi-arch index from the tested digests, tagged X.Y.Z, X.Y and latest on
# Docker Hub and the GHCR mirror) -> release (GitHub Release titled with the
# section's headline) and, for the newest final release, the Docker Hub overview.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version matching pyproject.toml, for example 1.2.3'
        required: true
        type: string
      publish:
        description: 'Publish versioned core images to Docker Hub and GHCR'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      core: ${{ steps.version.outputs.core }}
      image: ${{ steps.version.outputs.image }}
      mirror: ${{ steps.version.outputs.mirror }}
      minor: ${{ steps.version.outputs.minor }}
      latest: ${{ steps.version.outputs.latest }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      created: ${{ steps.version.outputs.created }}
      headline: ${{ steps.version.outputs.headline }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        name: Validate explicit release version and its CHANGELOG section
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.ref_name }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || github.repository_owner }}
          OWNER: ${{ github.repository_owner }}
          PUBLISHING: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          python - <<'PY'
          import os, re, subprocess, tomllib
          requested = os.environ['REQUESTED_VERSION'].removeprefix('v')
          actual = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          match = re.fullmatch(r'([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?', requested)
          if not match or requested != actual:
              raise SystemExit('The explicit release version must match pyproject.toml.')
          image = 'docker.io/' + os.environ['DOCKERHUB_NAMESPACE'].lower() + '/openings'
          mirror = 'ghcr.io/' + os.environ['OWNER'].lower() + '/openings'
          prerelease = bool(match.group(4))
          # Only final releases move the X.Y tag, and `latest` only when no final
          # release is newer: re-running an older release leaves it alone.
          minor = '' if prerelease else f'{match.group(1)}.{match.group(2)}'
          number = tuple(int(part) for part in match.groups()[:3])
          tags = subprocess.check_output(['git', 'ls-remote', '--tags', '--refs', 'origin', 'v*'], text=True)
          finals = re.findall(r'refs/tags/v([0-9]+)\.([0-9]+)\.([0-9]+)$', tags, re.M)
          latest = not prerelease and all(number >= tuple(map(int, final)) for final in finals)
          created = subprocess.check_output(
              ['git', 'log', '-1', '--date=format-local:%Y-%m-%dT%H:%M:%SZ', '--format=%cd'],
              env={**os.environ, 'TZ': 'UTC'}, text=True,
          ).strip()
          headline = ''
          if os.environ['PUBLISHING'] == 'true':
              # The section's first line is the headline of the release title; the
              # rest, with the upgrade line, is the release notes.
              lines = open('CHANGELOG.md', encoding='utf-8').read().splitlines()
              heading = re.compile(r'^##\s+\[?v?' + re.escape(requested) + r'\]?(\s|$)')
              start = next((i for i, line in enumerate(lines) if heading.match(line)), None)
              if start is None:
                  raise SystemExit(f'CHANGELOG.md has no "## {requested}" section.')
              end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith('## ')), len(lines))
              section = [line.rstrip() for line in lines[start + 1:end]]
              first = next((i for i, line in enumerate(section) if line.strip()), None)
              if first is None:
                  raise SystemExit(f'The CHANGELOG.md section for {requested} is empty.')
              headline = section[first].strip().rstrip('.')
              if re.match(r'[-*+#>|`]|[0-9]+[.)]\s', headline) or len(headline) > 100:
                  raise SystemExit(
                      f'The CHANGELOG.md section for {requested} must start with its headline: '
                      'one plain line of at most 100 characters before any list or bold heading, '
                      f'such as "Workday roles with several locations stay listed". Found: {section[first]!r}'
                  )
              body = '\n'.join(section[first + 1:]).strip()
              operations = (
                  f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/blob/v{requested}'
                  '/docs/user/operations.md#update'
              )
              upgrade = (
                  'Upgrade: back up, then `docker compose pull && docker compose up -d` '
                  f'(see [Operations]({operations})).'
              )
              path = os.path.join(os.environ['RUNNER_TEMP'], 'release-notes.md')
              with open(path, 'w', encoding='utf-8') as notes:
                  notes.write((body + '\n\n' if body else '') + upgrade + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(
                  f'version={requested}\ncore={image}:{requested}\nimage={image}\nmirror={mirror}\n'
                  f'minor={minor}\nlatest={str(latest).lower()}\nprerelease={str(prerelease).lower()}\n'
                  f'created={created}\nheadline={headline}\n'
              )
          PY
      - if: github.event_name == 'push' || inputs.publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 1

  # The tag is on a commit whose CI already ran: wait for that run and require
  # it to pass instead of running it again.
  checks:
    needs: version
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    steps:
      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          run=''
          for _ in {1..30}; do
            run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" \
              --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            if [ -n "$run" ]; then break; fi
            sleep 20
          done
          if [ -z "$run" ]; then
            echo "::error::No CI run for $SHA."
            exit 1
          fi
          gh run watch "$run" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30

  # Pull requests do not audit dependencies (weekly.yml does); a release still
  # refuses to publish over a known advisory.
  audit:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          # No cache in a release workflow: a poisoned one could reach the image.
          package-manager-cache: false
      - name: Audit dependencies
        run: scripts/audit_dependencies.sh

  image:
    name: image (${{ matrix.arch }})
    needs: [version, checks, audit]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: build
        name: Build natively and push by digest (no tag)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ needs.version.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ needs.version.outputs.created }}
          cache-from: type=gha,scope=core-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=core-${{ matrix.arch }}
          sbom: true
          provenance: mode=max
      - name: Smoke the pushed digest
        env:
          ARCH: ${{ matrix.arch }}
          REF: ${{ needs.version.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          docker pull --platform "linux/$ARCH" "$REF"
          scripts/smoke_image.sh "$REF" "$ARCH"
      - name: Record the tested digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [version, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # the GHCR mirror
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: index
        name: Tag the tested digests as one multi-arch image on both registries
        shell: bash
        env:
          IMAGE: ${{ needs.version.outputs.image }}
          MIRROR: ${{ needs.version.outputs.mirror }}
          VERSION: ${{ needs.version.outputs.version }}
          MINOR: ${{ needs.version.outputs.minor }}
          LATEST: ${{ needs.version.outputs.latest }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          sources=()
          for file in "$RUNNER_TEMP"/digests/*; do
            sources+=("$IMAGE@sha256:$(basename "$file")")
          done
          test "${#sources[@]}" -eq 2
          # One index pushed byte for byte under every tag, so both registries
          # serve the same digest.
          refs=()
          for image in "$IMAGE" "$MIRROR"; do
            refs+=("$image:$VERSION")
            if [ -n "$MINOR" ]; then refs+=("$image:$MINOR"); fi
            if [ "$LATEST" = true ]; then refs+=("$image:latest"); fi
          done
          tags=()
          for ref in "${refs[@]}"; do tags+=(--tag "$ref"); done
          # The description equals pyproject.toml's (scripts/check_package.py checks it).
          docker buildx imagetools create "${tags[@]}" \
            --annotation 'index:org.opencontainers.image.title=Openings' \
            --annotation 'index:org.opencontainers.image.description=Self-hosted job-search app. Set up your career, rules, templates and sources once; your own AI agent (Claude Code, Codex, any MCP client) works it by your rules. You apply.' \
            --annotation 'index:org.opencontainers.image.url=https://github.com/VincenzoImp/openings-job-search' \
            --annotation 'index:org.opencontainers.image.source=https://github.com/VincenzoImp/openings-job-search' \
            --annotation 'index:org.opencontainers.image.licenses=MIT' \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.revision=$REVISION" \
            "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION" --raw > "$RUNNER_TEMP/index.json"
          jq -e --arg version "$VERSION" --arg revision "$REVISION" '
            .annotations as $a
            | [.manifests[].platform | select(. != null) | "\(.os)/\(.architecture)"] as $platforms
            | ($platforms | index("linux/amd64")) != null
              and ($platforms | index("linux/arm64")) != null
              and $a["org.opencontainers.image.title"] == "Openings"
              and ($a["org.opencontainers.image.description"] // "") != ""
              and ($a["org.opencontainers.image.url"] // "") != ""
              and ($a["org.opencontainers.image.source"] // "") != ""
              and ($a["org.opencontainers.image.licenses"] // "") != ""
              and $a["org.opencontainers.image.version"] == $version
              and $a["org.opencontainers.image.revision"] == $revision' \
            "$RUNNER_TEMP/index.json"
          digest_of() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r .digest
          }
          digest="$(digest_of "$IMAGE:$VERSION")"
          case "$digest" in sha256:*) ;; *) exit 1 ;; esac
          for ref in "${refs[@]}"; do
            found="$(digest_of "$ref")"
            if [ "$found" != "$digest" ]; then
              echo "::error::$ref is $found, not $digest."
              exit 1
            fi
          done
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "Published $IMAGE:$VERSION@$digest as:"
            printf -- '- `%s`\n' "${refs[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke latest as a newcomer pulls it
        if: needs.version.outputs.latest == 'true'
        env:
          IMAGE: ${{ needs.version.outputs.image }}
        run: |
          docker pull --platform linux/amd64 "$IMAGE:latest"
          scripts/smoke_image.sh "$IMAGE:latest" amd64

  # The Docker Hub overview follows the newest final release: docs/dockerhub.md
  # and the short description below (scripts/check_package.py checks both sizes).
  # The Docker Hub page is edited by hand unless the repository variable
  # DOCKERHUB_DESCRIPTION_SYNC is "true"; the sync needs a Docker Hub token with
  # Read, Write, Delete in DOCKERHUB_DESCRIPTION_TOKEN.
  hub-description:
    needs: [version, publish]
    if: >-
      vars.DOCKERHUB_DESCRIPTION_SYNC == 'true' &&
      needs.version.outputs.prerelease == 'false' && needs.version.outputs.latest == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: repository
        name: Docker Hub repository of the image
        env:
          IMAGE: ${{ needs.version.outputs.image }}
        run: echo "name=${IMAGE#docker.io/}" >> "$GITHUB_OUTPUT"
      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN }}
          repository: ${{ steps.repository.outputs.name }}
          readme-filepath: docs/dockerhub.md
          short-description: 'Set up your job search once; your own AI agent works it by your rules. Self-hosted. You apply.'

  release:
    needs: [version, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes
      - name: Add the container image to the release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IMAGE: ${{ needs.version.outputs.image }}
          MIRROR: ${{ needs.version.outputs.mirror }}
          MINOR: ${{ needs.version.outputs.minor }}
          LATEST: ${{ needs.version.outputs.latest }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          python - <<'PY'
          import os
          env = os.environ
          tags = [env['VERSION']] + [env['MINOR']] * bool(env['MINOR']) + ['latest'] * (env['LATEST'] == 'true')
          tags = [f'`{tag}`' for tag in tags]
          tags = ', '.join(tags[:-1]) + ' and ' + tags[-1] if len(tags) > 1 else tags[0]
          path = os.path.join(env['RUNNER_TEMP'], 'notes', 'release-notes.md')
          with open(path, 'a', encoding='utf-8') as notes:
              notes.write(
                  f'\n## Container image\n\n'
                  f'Linux amd64/arm64, tagged {tags} on Docker Hub and GHCR:\n\n'
                  f'```\n{env["IMAGE"]}:{env["VERSION"]}@{env["DIGEST"]}\n'
                  f'{env["MIRROR"]}:{env["VERSION"]}@{env["DIGEST"]}\n```\n'
              )
          PY
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          HEADLINE: ${{ needs.version.outputs.headline }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          title="Openings $VERSION: $HEADLINE"
          notes="$RUNNER_TEMP/notes/release-notes.md"
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > /dev/null 2>&1; then
            echo "::warning::Tag $tag does not exist; push it to create the GitHub Release."
            exit 0
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file "$notes"
          else
            flags=()
            if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$title" --notes-file "$notes" "${flags[@]}"
          fi
