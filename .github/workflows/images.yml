name: Release images

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version matching pyproject.toml, for example 0.5.0'
        required: true
        type: string
      publish:
        description: 'Publish versioned core and scorer images to GHCR'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      core: ${{ steps.version.outputs.core }}
      scorer: ${{ steps.version.outputs.scorer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        name: Validate explicit release version
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os, re, tomllib
          requested = os.environ['REQUESTED_VERSION'].removeprefix('v')
          actual = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?', requested) or requested != actual:
              raise SystemExit('The explicit release version must match pyproject.toml.')
          base = 'ghcr.io/' + os.environ['REPOSITORY'].lower()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={requested}\ncore={base}:{requested}\nscorer={base}-scorer:{requested}\n')
          PY

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [version, checks]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish model-free core
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.version.outputs.core }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: |
            type=gha,scope=core-amd64
            type=gha,scope=core-arm64
          cache-to: type=gha,mode=max,scope=core-release
      - name: Publish optional CPU scorer
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: scorer/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.version.outputs.scorer }}
          cache-from: type=gha,scope=scorer-release
          cache-to: type=gha,mode=max,scope=scorer-release
