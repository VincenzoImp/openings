[project]
name = "openings"
version = "0.1.0"
description = "A configurable job crawler, archive and application tracker you run yourself. Agent-operable through MCP."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["jobs", "job-search", "applicant-tracking", "mcp", "scraper"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = [
    "python-jobspy>=1.1.80,<2.0.0",
    "pandas>=2.0.0,<3.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "tenacity>=8.0.0,<9.0.0",
    "APScheduler>=3.10.0,<4.0.0",
    "python-telegram-bot>=21.0,<22.0",
    "rapidfuzz>=3.0.0,<4.0.0",
    "onnxruntime>=1.17.0,<2.0.0",
    "tokenizers>=0.15.0,<1.0.0",
    "numpy>=1.26.0",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.34.0,<1.0.0",
    "mcp[cli]>=1.0.0,<2.0.0",
    "requests>=2.31.0,<3.0.0",
    "markdownify>=0.13.0,<2.0.0",
    "feedparser>=6.0.0,<7.0.0",
    "python-multipart>=0.0.31",
]

[project.urls]
Homepage = "https://github.com/VincenzoImp/openings"
Repository = "https://github.com/VincenzoImp/openings"
Changelog = "https://github.com/VincenzoImp/openings/blob/main/CHANGELOG.md"

[project.scripts]
openings = "openings.cli:main"
openings-web = "openings.web.app:main"
openings-healthcheck = "openings.healthcheck:main"

[build-system]
requires = ["hatchling>=1.26.0,<2.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openings"]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "pytest-timeout>=2.2.0,<3.0.0",
    "pytest-randomly>=3.15.0,<4.0.0",
    "httpx>=0.27.0,<1.0.0",
    "mypy>=1.5.0,<2.0.0",
    "types-PyYAML>=6.0.0,<7.0.0",
    "types-requests>=2.31.0,<3.0.0",
    # Keep in step with the ruff-pre-commit rev in .pre-commit-config.yaml so
    # `uv run ruff` and the git hook resolve to the same behavior.
    "ruff>=0.15.6,<1.0.0",
    "pip-audit>=2.7.0,<3.0.0",
    "pre-commit>=4.0.0,<5.0.0",
]

[tool.uv]
# python-jobspy pins numpy==1.26.3 and markdownify<0.14; both are stale and
# the newer releases work, so the pins are overridden here.
override-dependencies = [
    "numpy>=1.26.0",
    "markdownify>=0.14.1",
]
constraint-dependencies = [
    # Security floors for transitive runtime dependencies audited in CI.
    "cryptography>=50.0.0",
    "gitpython>=3.1.50",
    "idna>=3.15",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
    "urllib3>=2.7.0",
]
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
