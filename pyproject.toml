[project]
name = "openings"
version = "1.0.0"
description = "A portable, agent-friendly job-search workspace."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "fastapi==0.162.0", "uvicorn==0.54.0", "mcp==1.30.0",
  "httpx==0.28.1", "python-multipart==0.0.32", "itsdangerous==2.2.0",
]

[project.scripts]
openings = "openings.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/openings"]

[dependency-groups]
dev = ["pytest==9.0.3", "pytest-asyncio==1.4.0", "ruff==0.15.10"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
