[project]
name = "openings"
version = "0.24.2"
description = "A self-hosted job-search workspace: collect jobs, prepare applications and track replies, by hand or with your own AI agent."
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
dependencies = [
  "fastapi==0.162.2", "uvicorn==0.54.0", "mcp==2.3.0",
  "requests==2.34.2", "beautifulsoup4==4.15.0", "curl-cffi==0.17.0", "markdownify==1.2.3",
  "httpx==0.28.1", "httpcore==1.0.9", "itsdangerous==2.2.0",
  # Readable text of a PDF-only CV or letter revision: pure Python, no TeX or system library.
  "pypdf==6.21.4",
]

[project.scripts]
openings = "openings.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/openings"]

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "README.md" },
  { file = "backend/openings/**/*" },
]

[dependency-groups]
dev = [
  "pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "pytest-xdist==3.8.0", "ruff==0.17.4",
  # Validates the served OpenAPI document (test_openapi.py).
  "openapi-spec-validator==0.9.0",
]
# The uv that CI uses: setup-uv reads it here and Dependabot updates it. Not installed.
uv = ["uv==0.13.8"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::ResourceWarning"]
# Performance budgets and benchmarks run weekly (weekly.yml) or with `-m performance`.
addopts = "-m 'not performance'"
markers = [
  "performance: time budgets of hot reads on a large synthetic workspace (select with -m performance)",
]

[tool.ruff]
target-version = "py314"
line-length = 100
# Lets import sorting recognize `openings` and sibling test modules as first-party.
src = ["backend", "backend/tests"]

[tool.ruff.lint]
# No `select`: the project follows Ruff's default rule set (widened in 0.17).
# Ruff is pinned in the dev group, so the set only changes with a reviewed
# upgrade. Deviations are listed here with their reason; single call sites that
# are deliberate carry an inline `# noqa: <rule>` with the reason next to it.

[tool.ruff.lint.isort]
# Keep `from x import (A, b as c)` in one statement, as the code is written.
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# Vendored code stays byte-identical to upstream to simplify future updates.
# Correctness rules (pycodestyle errors, Pyflakes, bugbear, ...) still apply;
# only the style and modernization rules that would require edits are waived:
# broad provider `except Exception` handlers (BLE001), import order (I001),
# upstream `noqa` markers for rules this project does not enable (RUF100), and
# pyupgrade rewrites (UP).
"backend/openings/_vendor/**" = ["BLE001", "I001", "RUF100", "UP"]

[tool.ruff.format]
# Vendored code keeps its upstream formatting to simplify future updates.
exclude = ["backend/openings/_vendor/**"]
