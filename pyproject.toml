[project]
name = "openings"
version = "0.15.2"
description = "A portable, agent-friendly job-search workspace."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "fastapi==0.162.2", "uvicorn==0.54.0", "mcp==1.30.0",
  "requests==2.34.2", "beautifulsoup4==4.15.0", "curl-cffi==0.17.0", "markdownify==1.2.3",
  "httpx==0.28.1", "python-multipart==0.0.33", "itsdangerous==2.2.0",
]

[project.scripts]
openings = "openings.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/openings"]

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "README.md" },
  { file = "backend/openings/**/*" },
]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "ruff==0.17.4"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Keep the established rule set; Ruff 0.17 widened its defaults. Adopting more
# rules is a separate cleanup, not part of a dependency update.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
# Vendored code keeps its upstream formatting to simplify future updates.
exclude = ["backend/openings/_vendor/**"]
