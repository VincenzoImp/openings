# Build the image from the local checkout instead of pulling it.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build -d

x-local-build: &local-build
  build:
    context: .
  image: ${OPENINGS_DEV_IMAGE:-openings:dev}

services:
  scheduler:
    <<: *local-build
    container_name: openings-scheduler-dev

  web:
    <<: *local-build
    container_name: openings-web-dev
